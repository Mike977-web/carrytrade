<style>

/* ---------- 基础工具 ---------- */
const fmt = v => {
  if (v === null || v === undefined || !isFinite(v)) return '—';
  const a = Math.abs(v);
  const d = a >= 100000 ? 0 : a >= 10 ? 2 : a >= 1 ? 3 : 4;
  return v.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: d});
};
const fmtPct = v => (v === null || v === undefined || !isFinite(v))
  ? '—' : (v > 0 ? '+' : '') + v.toFixed(2) + '%';
const cls = v => (v === null || v === undefined || !isFinite(v) || Math.abs(v) < 1e-9)
  ? 'flat' : (v > 0 ? 'up' : 'down');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rgbOf = n => (n === 'up' || n === 'down') ? (n === 'up' ? '#d92b2b' : '#0f9d58') : '#8b939c';
const md = s => (s || '').slice(5);   // 'YYYY-MM-DD' → 'MM-DD'

/* ---------- 状态 ---------- */
const M = DATA.meta;
const state = {
  sector: 'all', q: '', sort: 'order', onlyMove: false, hMode: 'pct',
};

/* ---------- 取窗口（默认窗口：近 N 个工作日，口径固定） ---------- */
function winOf(it) {
  const h = it.hist || {dates: [], values: []};
  let i = 0;
  while (i < h.dates.length && h.dates[i] < M.winStart) i++;
  return {dates: h.dates.slice(i), values: h.values.slice(i)};
}
function statOf(it) {
  const w = winOf(it), V = w.values;
  if (V.length < 1) return {n: 0, pct: null, hi: null, lo: null, amp: null};
  const first = V[0], last = V[V.length - 1];
  return {
    n: V.length, first, last,
    pct: V.length > 1 && first ? (last - first) / Math.abs(first) * 100 : null,
    hi: Math.max.apply(null, V), lo: Math.min.apply(null, V),
    amp: first ? (Math.max.apply(null, V) - Math.min.apply(null, V)) / Math.abs(first) * 100 : null,
    span: w.dates.length ? w.dates[0] + ' ~ ' + w.dates[w.dates.length - 1] : '',
  };
}

/* ---------- 通用折线图 ---------- */
function chartPaths(series, W, H, pad) {
  const all = [];
  series.forEach(s => s.values.forEach(v => { if (isFinite(v)) all.push(v); }));
  if (!all.length) return null;
  let mn = Math.min.apply(null, all), mx = Math.max.apply(null, all);
  if (mx - mn < 1e-9) { mx = mn + Math.abs(mn || 1) * 0.02; mn -= Math.abs(mn || 1) * 0.02; }
  else { const p = (mx - mn) * 0.08; mn -= p; mx += p; }
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const N = Math.max(1, series[0].values.length);
  const X = i => pad.l + (N === 1 ? iw / 2 : i * iw / (N - 1));
  const Y = v => pad.t + ih - (v - mn) / (mx - mn) * ih;
  const out = series.map(s => {
    const d = s.values.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
    return {name: s.name, color: s.color, d, pts: s.values.map((v, i) => [X(i), Y(v), v, i])};
  });
  return {paths: out, X, Y, mn, mx, iw, ih, N};
}

/* ---------- 迷你折线图 ---------- */
function miniChart(it, w, h) {
  const wd = winOf(it);
  if (wd.values.length < 2) return '<div class="nodata">该区间内无数据</div>';
  const V = wd.values, st = statOf(it);
  const pad = {l: 34, r: 8, t: 8, b: 16};
  const g = chartPaths([{name: '', color: '#000', values: V}], w, h, pad);
  const col = rgbOf(cls(st.pct));
  let svg = '<svg viewBox="0 0 ' + w + ' ' + h + '">';
  for (let i = 0; i <= 2; i++) {
    const v = g.mn + (g.mx - g.mn) * i / 2, y = g.Y(v).toFixed(1);
    svg += '<line x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + y + '" y2="' + y +
      '" stroke="#eef0f3" stroke-width="1"/>' +
      '<text x="' + (pad.l - 5) + '" y="' + (+y + 3.4) + '" text-anchor="end" fill="#a8b0b9" font-size="9">' +
      esc(fmt(v)) + '</text>';
  }
  const p = g.paths[0];
  const lx = p.pts[p.pts.length - 1][0], fx = p.pts[0][0], by = h - pad.b;
  svg += '<path d="' + p.d + ' L ' + lx.toFixed(1) + ' ' + by + ' L ' + fx.toFixed(1) + ' ' + by +
    ' Z" fill="' + col + '" opacity="0.12"/>' +
    '<path d="' + p.d + '" fill="none" stroke="' + col + '" stroke-width="1.9" stroke-linejoin="round" ' +
    'stroke-linecap="round"/>' +
    '<circle cx="' + lx.toFixed(1) + '" cy="' + p.pts[p.pts.length - 1][1].toFixed(1) +
    '" r="2.6" fill="' + col + '" stroke="#fff" stroke-width="1.2"/>' +
    '<text x="' + pad.l + '" y="' + (h - 4) + '" fill="#a8b0b9" font-size="9">' + esc(md(wd.dates[0])) + '</text>' +
    '<text x="' + (w - pad.r) + '" y="' + (h - 4) + '" text-anchor="end" fill="#a8b0b9" font-size="9">' +
    esc(md(wd.dates[wd.dates.length - 1])) + '</text>';
  return svg + '</svg>';
}

/* ---------- KPI ---------- */
function renderKpis() {
  const st = DATA.items.map(i => ({i: i, s: statOf(i)})).filter(x => x.s.pct !== null && isFinite(x.s.pct));
  const up = st.filter(x => x.s.pct > 0).length, dn = st.filter(x => x.s.pct < 0).length;
  const fl = st.length - up - dn;
  const avg = st.length ? st.reduce((a, x) => a + x.s.pct, 0) / st.length : null;
  const sorted = st.slice().sort((a, b) => b.s.pct - a.s.pct);
  const top = sorted[0], bot = sorted[sorted.length - 1];
  const card = (k, v, c, s) => '<div class="kpi"><div class="k">' + k + '</div><div class="v ' + (c || '') + '">' +
    v + '</div><div class="s">' + (s || '') + '</div></div>';
  const winTxt = md(M.winStart) + ' → ' + md(M.latest);
  const winSub = '近 ' + M.windowN + ' 个工作日，各指标口径一致';
  document.getElementById('kpis').innerHTML =
    card('区间涨跌家数', up + ' / ' + dn, '', '上涨 / 下跌，共 ' + st.length + ' 个有效指标') +
    card('区间平均涨跌', fmtPct(avg), cls(avg), '等权平均 · ' + winSub) +
    card('最强', top ? fmtPct(top.s.pct) : '—', top ? cls(top.s.pct) : '', top ? esc(top.i.name) : '') +
    card('最弱', bot ? fmtPct(bot.s.pct) : '—', bot ? cls(bot.s.pct) : '', bot ? esc(bot.i.name) : '') +
    card('取数窗口', winTxt, '', winSub);
}

/* ---------- 卡片列表 ---------- */
function list() {
  let it = DATA.items.filter(i => state.sector === 'all' || i.sector === state.sector);
  if (state.q.trim()) {
    const q = state.q.trim().toLowerCase();
    it = it.filter(i => i.name.toLowerCase().includes(q) || (i.iid || '').toLowerCase().includes(q));
  }
  if (state.onlyMove) it = it.filter(i => { const p = statOf(i).pct; return p !== null && Math.abs(p) >= 2; });
  return it;
}
function sortList(arr) {
  const g = n => { const p = statOf(n).pct; return p === null ? -Infinity : p; };
  if (state.sort === 'pct') arr.sort((a, b) => g(b) - g(a));
  else if (state.sort === 'pcta') arr.sort((a, b) => g(a) - g(b));
  else if (state.sort === 'value') arr.sort((a, b) => (b.value || -Infinity) - (a.value || -Infinity));
  else if (state.sort === 'name') arr.sort((a, b) => a.name.localeCompare(b.name, 'zh'));
  else if (state.sort === 'n') arr.sort((a, b) => b.n - a.n);
  else if (state.sort === 'order') arr.sort((a, b) => (a.order ?? 1e9) - (b.order ?? 1e9));
  else if (state.sort === 'orderr') arr.sort((a, b) => (b.order ?? -1e9) - (a.order ?? -1e9));
  return arr;
}
function cardHTML(it) {
  const st = statOf(it);
  const secTag = it.sector.indexOf('油') === 0
    ? '<span style="color:#2563eb">油-芳烃</span>' : '<span style="color:#7c3aed">气煤-烯烃</span>';
  return '<div class="card" data-n="' + esc(it.name) + '">' +
    '<div class="cn">' + esc(it.name) + '</div>' +
    '<div class="csub">' + secTag + ' · ' + esc(it.unit || '—') + ' · ' + esc(it.date || '') + '</div>' +
    '<div class="cv"><span class="price">' + fmt(st.n ? st.last : null) + '</span>' +
      '<span class="pill ' + cls(st.pct) + '">' + fmtPct(st.pct) + '</span></div>' +
    miniChart(it, 268, 84) +
    '<div class="cf"><span>区间高低 ' + fmt(st.lo) + ' ~ ' + fmt(st.hi) + '</span>' +
      '<span>' + (st.n ? st.n + ' 点' : '') + (st.amp !== null ? ' · 振幅 ' + fmtPct(st.amp) : '') + '</span></div>' +
  '</div>';
}
function renderGrid() {
  const host = document.getElementById('grid');
  let html = '';
  if (state.sector === 'all') {
    M.sheets.forEach(s => {
      const arr = sortList(list().filter(i => i.sector === s.name));
      if (!arr.length) return;
      html += '<div class="sechead"><span class="dot" style="background:' +
        (s.name.indexOf('油') === 0 ? '#2563eb' : '#7c3aed') + '"></span>' + esc(s.name) +
        '<span class="cnt">' + arr.length + ' 个指标 · 数据至 ' + esc(s.latest || '—') + '</span></div>' +
        '<div class="grid">' + arr.map(cardHTML).join('') + '</div>';
    });
  } else {
    const arr = sortList(list());
    html = arr.length
      ? '<div class="grid">' + arr.map(cardHTML).join('') + '</div>'
      : '<div class="panel" style="text-align:center;color:#8b939c;padding:44px">没有匹配的指标</div>';
  }
  host.innerHTML = html || '<div class="panel" style="text-align:center;color:#8b939c;padding:44px">没有匹配的指标</div>';
}

/* ---------- 窗口工作日序列（周六/周日已剔除，供明细矩阵与统计使用） ---------- */
const pad2 = n => (n < 10 ? '0' : '') + n;
const isoOf = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());

let __DAYS = null, __MAT = null, __DST = null;

function buildDays() {
  if (__DAYS) return __DAYS;
  const out = [];
  if (M.winStart && M.latest) {
    const a = M.winStart.split('-'), b = M.latest.split('-');
    const d = new Date(+a[0], +a[1] - 1, +a[2]);
    const end = new Date(+b[0], +b[1] - 1, +b[2]);
    let guard = 0;
    while (d <= end && guard++ < 92) {
      if (!M.excludeWeekend || (d.getDay() !== 0 && d.getDay() !== 6)) out.push(isoOf(d));
      d.setDate(d.getDate() + 1);
    }
  }
  __DAYS = out;
  return out;
}

/* 每个指标在窗口内每一天的 {价格, 当日涨跌幅}；无数据的那天为 null */
function matrix() {
  if (__MAT) return __MAT;
  const days = buildDays(), m = {};
  DATA.items.forEach(it => {
    const h = it.hist || {dates: [], values: []};
    const idx = Object.create(null);
    h.dates.forEach((d, i) => { idx[d] = i; });
    m[it.name] = days.map(d => {
      const i = idx[d];
      if (i === undefined) return {v: null, pct: null};
      const v = h.values[i], p = i > 0 ? h.values[i - 1] : null;
      const pctv = (p === null || p === undefined) ? null
        : (Math.abs(p) < 1e-12 ? 0 : (v - p) / Math.abs(p) * 100);
      return {v: v, pct: pctv};
    });
  });
  __MAT = m;
  return m;
}

/* 每一天的横截面统计 */
function dayStats() {
  if (__DST) return __DST;
  const days = buildDays(), mt = matrix();
  __DST = days.map((d, k) => {
    let n = 0, up = 0, dn = 0, fl = 0, sum = 0, best = null, worst = null;
    const ps = [];
    DATA.items.forEach(it => {
      const c = mt[it.name][k];
      if (!c || c.v === null || c.pct === null || !isFinite(c.pct)) return;
      n++; sum += c.pct; ps.push(c.pct);
      if (c.pct > 1e-9) up++; else if (c.pct < -1e-9) dn++; else fl++;
      if (!best || c.pct > best.pct) best = {name: it.name, pct: c.pct};
      if (!worst || c.pct < worst.pct) worst = {name: it.name, pct: c.pct};
    });
    ps.sort((x, y) => x - y);
    const med = ps.length
      ? (ps.length % 2 ? ps[(ps.length - 1) / 2] : (ps[ps.length / 2 - 1] + ps[ps.length / 2]) / 2)
      : null;
    return {
      d: d, n: n, up: up, dn: dn, fl: fl, ps: ps,
      avg: n ? sum / n : null, med: med,
      spread: ps.length ? ps[ps.length - 1] - ps[0] : null,
      ratio: n ? up / n * 100 : null, best: best, worst: worst,
    };
  });
  return __DST;
}

/* 涨跌幅 → 热力配色（国内惯例：红涨绿跌） */
function heatStyle(p) {
  if (p === null || p === undefined || !isFinite(p)) return {bg: '#fbfcfd', fg: '#ccd2d9'};
  if (Math.abs(p) < 1e-9) return {bg: 'rgba(139,147,156,.10)', fg: '#8b939c'};
  const t = Math.min(1, Math.abs(p) / 3);           // ±3% 视为满格
  const a = 0.07 + t * 0.63;
  const bg = p > 0 ? 'rgba(217,43,43,' + a.toFixed(3) + ')' : 'rgba(15,157,88,' + a.toFixed(3) + ')';
  const fg = t > 0.55 ? '#ffffff' : (p > 0 ? '#a81f1f' : '#0b7a44');
  return {bg: bg, fg: fg};
}


/* ---------- 逐日明细矩阵（指标 × 每一天） ---------- */
function renderHeat() {
  const host = document.getElementById('heat');
  const days = buildDays(), mt = matrix();
  if (!days.length) {
    host.innerHTML = '<div class="nodata" style="height:200px">无可用窗口</div>';
    return;
  }
  const showPrice = state.hMode === 'price';
  const head = '<thead><tr><th class="hname">指标</th>' +
    days.map(d => '<th>' + esc(md(d)) + '</th>').join('') +
    '<th class="hsum">区间累计</th></tr></thead>';

  function row(it) {
    const cells = mt[it.name];
    let tds = '', fv = null, lv = null;
    cells.forEach((c, k) => {
      if (c.v === null) {
        tds += '<td class="hc nil" title="' + esc(days[k] + ' · 无数据') + '">·</td>';
        return;
      }
      if (fv === null) fv = c.v;
      lv = c.v;
      const t = esc(days[k] + ' · ' + fmt(c.v) + (it.unit ? ' ' + it.unit : '') +
        (c.pct === null ? '' : ' · ' + fmtPct(c.pct)));
      if (showPrice) {
        tds += '<td class="hc" title="' + t + '">' + fmt(c.v) + '</td>';
      } else if (c.pct === null) {
        tds += '<td class="hc dnull">—</td>';
      } else {
        const h = heatStyle(c.pct);
        tds += '<td class="hc" style="background:' + h.bg + ';color:' + h.fg + '" title="' + t + '">' +
          (c.pct > 0 ? '+' : '') + c.pct.toFixed(1) + '%</td>';
      }
    });
    const cum = (fv !== null && lv !== null && Math.abs(fv) > 1e-12)
      ? (lv - fv) / Math.abs(fv) * 100 : null;
    tds += '<td class="hsum ' + cls(cum) + '">' + (cum === null ? '—' : fmtPct(cum)) + '</td>';
    return '<tr><td class="hname" title="' + esc(it.name) + '">' + esc(it.name) + '</td>' + tds + '</tr>';
  }

  let body = '';
  if (state.sector === 'all') {
    M.sheets.forEach(s => {
      const arr = sortList(list().filter(i => i.sector === s.name));
      if (!arr.length) return;
      body += '<tr class="srow"><td colspan="' + (days.length + 2) + '">' + esc(s.name) + ' · ' +
        arr.length + ' 个指标 · 数据至 ' + esc(s.latest || '—') + '</td></tr>' + arr.map(row).join('');
    });
  } else {
    const arr = sortList(list());
    body = arr.length ? arr.map(row).join('')
      : '<tr><td class="hname">无匹配</td><td colspan="' + (days.length + 1) + '">—</td></tr>';
  }

  let tot = '';
  if (!showPrice) {
    const st = dayStats();
    tot = '<tr class="tot"><td class="hname">当日平均（全部指标）</td>' +
      st.map(s => '<td class="hc ' + cls(s.avg) + '">' + (s.avg === null ? '—' : fmtPct(s.avg)) + '</td>').join('') +
      '<td class="hsum">—</td></tr>';
  }
  host.innerHTML = '<table class="hm">' + head + '<tbody>' + body + tot + '</tbody></table>';
  document.getElementById('hHint').textContent = showPrice
    ? '每格 = 该指标当日价格，「·」= 当日无数据'
    : '每格 = 该指标当日涨跌幅（相对上一有效点）· 颜色越深幅度越大（满格 ±3%）· 行末为区间累计';
}

/* ---------- 渲染调度 ---------- */
function refresh() {
  renderKpis();
  renderHeat();
  renderGrid();
}

function tabs(id, opts, cur, onPick) {
  document.getElementById(id).innerHTML = opts.map(o =>
    '<button data-k="' + o.k + '" class="' + (cur === o.k ? 'on' : '') + '">' + o.t + '</button>').join('');
  document.getElementById(id).querySelectorAll('button').forEach(b =>
    b.onclick = () => { onPick(b.dataset.k); refresh(); });
}

function boot() {
  document.getElementById('meta').innerHTML =
    '<span>数据源 <b>' + esc(M.file) + '</b></span>' +
    '<span>数据截止 <b>' + esc(M.latest || '—') + '</b>' +
      (M.latestMain && M.latestMain !== M.latest ? '（多数指标至 ' + esc(M.latestMain) + '）' : '') + '</span>' +
    '<span>生成时间 <b>' + esc(M.generated) + '</b></span>' +
    '<span>指标 <b>' + M.total + '</b> 个 · 板块 <b>' + M.sectors + '</b> 个</span>';
  if (M.warn) { const w = document.getElementById('warn'); w.textContent = M.warn; w.style.display = 'block'; }

  tabs('hModeTabs', [{k:'pct',t:'逐日涨跌幅'},{k:'price',t:'逐日价格'}],
    state.hMode, k => state.hMode = k);
  renderSectors();

  document.getElementById('q').oninput = e => { state.q = e.target.value; renderLists(); };
  document.getElementById('onlyMove').onchange = e => { state.onlyMove = e.target.checked; renderLists(); };
  document.getElementById('sortSel').onchange = e => {
    state.sort = e.target.value;
    renderLists();
  };

  document.getElementById('foot').innerHTML = M.noteShow;
  refresh();
}
function renderSectors() {
  const opts = [{k:'all', t:'全部 ' + DATA.items.length}].concat(
    M.sheets.map(s => ({k: s.name, t: s.name + ' ' + s.n})));
  document.getElementById('sectorTabs').innerHTML = opts.map(o =>
    '<button data-k="' + esc(o.k) + '" class="' + (state.sector === o.k ? 'on' : '') + '">' + esc(o.t) + '</button>').join('');
  document.getElementById('sectorTabs').querySelectorAll('button').forEach(b =>
    b.onclick = () => { state.sector = b.dataset.k; renderSectors(); renderLists(); });
}

/* 搜索 / 板块 / 排序变化时，矩阵与卡片列表同步刷新 */
function renderLists() { renderHeat(); renderGrid(); }
boot();
</script>
