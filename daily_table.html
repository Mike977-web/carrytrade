  const d = a >= 100000 ? 0 : a >= 10 ? 2 : a >= 1 ? 3 : 4;
  return v.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: d});
};
const fmtPct = v => (v === null || v === undefined || !isFinite(v))
  ? '—' : (v > 0 ? '+' : '') + v.toFixed(2) + '%';
const fmtChg = v => (v === null || v === undefined || !isFinite(v))
  ? '—' : (v > 0 ? '+' : '') + fmt(v);
const cls = v => (v === null || v === undefined || !isFinite(v) || Math.abs(v) < 1e-9)
  ? 'flat' : (v > 0 ? 'up' : 'down');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 迷你走势图 ---------- */
function spark(rec) {
  const v = (rec.spark.values || []).filter(x => x !== null && isFinite(x));
  if (v.length < 2) return '<span class="flat">—</span>';
  const w = 108, h = 28, pad = 3;
  const mn = Math.min(...v), mx = Math.max(...v), rng = (mx - mn) || Math.abs(mx) || 1;
  const step = (w - pad * 2) / (v.length - 1);
  const pts = v.map((x, i) => [pad + i * step, h - pad - ((x - mn) / rng) * (h - pad * 2)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = d + ' L ' + pts[pts.length-1][0].toFixed(1) + ' ' + (h-pad) +
               ' L ' + pts[0][0].toFixed(1) + ' ' + (h-pad) + ' Z';
  const tot = rec.perf.p10 ? rec.perf.p10.pct : null;
  const col = cls(tot) === 'up' ? '#d92b2b' : cls(tot) === 'down' ? '#0f9d58' : '#8b939c';
  const lp = pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '">' +
    '<path d="' + area + '" fill="' + col + '" opacity="0.12"/>' +
    '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + lp[0].toFixed(1) + '" cy="' + lp[1].toFixed(1) + '" r="2.3" fill="' + col + '"/></svg>';
}

/* ---------- 状态 ---------- */
let state = { sector: 'all', q: '', onlyMove: false, onlyStale: false, sort: 'chgp', dir: -1, open: null };
const SECTORS = [
  {k: 'all', label: '全部', n: DATA.items.length},
  {k: '油-芳烃板块', label: '油-芳烃板块'},
  {k: '气煤-烯烃板块', label: '气煤-烯烃板块'},
];
SECTORS.forEach(s => { if (s.n === undefined) s.n = DATA.items.filter(i => i.sector === s.k).length; });

/* ---------- 头部 ---------- */
function renderMeta() {
  const m = DATA.meta;
  document.getElementById('meta').innerHTML =
    '<span>数据源 <b>' + esc(m.file) + '</b></span>' +
    '<span>最新数据日 <b>' + esc(m.latest || '—') + '</b>' +
      (m.latestMain && m.latestMain !== m.latest ? '（多数指标至 ' + esc(m.latestMain) + '）' : '') + '</span>' +
    '<span>生成时间 <b>' + esc(m.generated) + '</b></span>' +
    '<span>指标 <b>' + m.total + '</b> 个 · 板块 <b>' + m.sectors + '</b> 个</span>';
  const w = document.getElementById('warn');
  if (m.warn) { w.textContent = m.warn; w.style.display = 'block'; }
}
function renderKpis() {
  const it = DATA.items.filter(i => i.chg_pct !== null && isFinite(i.chg_pct));
  const up = it.filter(i => i.chg_pct > 0).length;
  const dn = it.filter(i => i.chg_pct < 0).length;
  const fl = it.length - up - dn;
  const byP = it.slice().sort((a, b) => b.chg_pct - a.chg_pct);
  const top = byP[0], bot = byP[byP.length - 1];
  const p10 = DATA.items.filter(i => i.perf.p10 && i.perf.p10.pct !== null && isFinite(i.perf.p10.pct));
  const up10 = p10.filter(i => i.perf.p10.pct > 0).length;
  const avg10 = p10.length ? p10.reduce((s, i) => s + i.perf.p10.pct, 0) / p10.length : null;
  const stale = DATA.items.filter(i => i.stale).length;
  const card = (k, v, c, s) => '<div class="kpi"><div class="k">' + k + '</div><div class="v ' + (c||'') + '">' + v +
    '</div><div class="s">' + (s || '') + '</div></div>';
  document.getElementById('kpis').innerHTML =
    card('上涨 / 下跌 / 持平', up + ' / ' + dn + ' / ' + fl, '',
         '覆盖 ' + DATA.items.length + ' 个指标，' + stale + ' 个数据滞后') +
    card('涨幅最大', top ? fmtPct(top.chg_pct) : '—', top ? cls(top.chg_pct) : '',
         top ? esc(top.name) + ' · ' + fmt(top.value) : '') +
    card('跌幅最大', bot ? fmtPct(bot.chg_pct) : '—', bot ? cls(bot.chg_pct) : '',
         bot ? esc(bot.name) + ' · ' + fmt(bot.value) : '') +
    card('近10期上涨占比', p10.length ? Math.round(up10 / p10.length * 100) + '%' : '—', '',
         up10 + ' / ' + p10.length + ' 个指标') +
    card('近10期平均涨跌幅', avg10 === null ? '—' : fmtPct(avg10), cls(avg10), '等权平均');
}

/* ---------- 表头 ---------- */
const COLS = [
  {k: 'name',    t: '指标名称',        l: 1, s: (a,b) => a.name.localeCompare(b.name, 'zh')},
  {k: 'unit',    t: '单位',            l: 1, cls: 'hide-s', s: (a,b) => (a.unit||'').localeCompare(b.unit||'', 'zh')},
  {k: 'date',    t: '最新日期',        l: 1, s: (a,b) => (a.date||'').localeCompare(b.date||'')},
  {k: 'value',   t: '最新价',          s: (a,b) => (a.value ?? -Infinity) - (b.value ?? -Infinity)},
  {k: 'chg',     t: '涨跌额',          cls: 'hide-s', s: (a,b) => (a.chg ?? -Infinity) - (b.chg ?? -Infinity)},
  {k: 'chgp',    t: '涨跌幅',          s: (a,b) => (a.chg_pct ?? -Infinity) - (b.chg_pct ?? -Infinity)},
  {k: 'p10',     t: '近10期涨跌幅',    s: (a,b) => ((a.perf.p10 ? a.perf.p10.pct : null) ?? -Infinity) - ((b.perf.p10 ? b.perf.p10.pct : null) ?? -Infinity)},
  {k: 'spark',   t: '近10期走势',      cls: 'hide-s l'},
  {k: 'range',   t: '近10期区间',      cls: 'hide-s l'},
  {k: 'n',       t: '数据点',          cls: 'hide-s', s: (a,b) => a.n - b.n},
];
function renderHead() {
  document.getElementById('thead').innerHTML = COLS.map(c => {
    const on = state.sort === c.k;
    const ar = on ? (state.dir > 0 ? '▲' : '▼') : '▲';
    return '<th data-k="' + c.k + '" class="' + (c.l ? 'l ' : '') + (c.cls || '') + (on ? ' sorted' : '') + '">' +
      c.t + '<span class="ar">' + ar + '</span></th>';
  }).join('');
  document.querySelectorAll('#thead th').forEach(th => {
    th.onclick = () => {
      const k = th.dataset.k;
      if (state.sort === k) state.dir = -state.dir;
      else { state.sort = k; state.dir = k === 'name' || k === 'date' || k === 'unit' || k === 'range' ? 1 : -1; }
      render();
    };
  });
}

/* ---------- 主体 ---------- */
function rows() {
  let it = DATA.items.filter(i => state.sector === 'all' || i.sector === state.sector);
  if (state.q.trim()) {
    const q = state.q.trim().toLowerCase();
    it = it.filter(i => i.name.toLowerCase().includes(q) || (i.iid || '').toLowerCase().includes(q));
  }
  if (state.onlyMove) it = it.filter(i => i.chg_pct !== null && Math.abs(i.chg_pct) >= 1);
  if (state.onlyStale) it = it.filter(i => i.stale);
  const c = COLS.find(x => x.k === state.sort);
  if (c && c.s) it = it.slice().sort((a, b) => c.s(a, b) * state.dir);
  return it;
}
function detailRow(rec) {
  const sp = rec.spark;
  const rowsHtml = sp.dates.map((d, i) => {
    const ch = i > 0 ? sp.changes[i] : null;
    const abs = i > 0 ? sp.values[i] - sp.values[i-1] : null;
    return '<tr><td>' + esc(d) + (i === sp.dates.length - 1 ? ' <span class="tag">最新</span>' : '') + '</td>' +
      '<td>' + fmt(sp.values[i]) + '</td>' +
      '<td class="' + (i ? cls(abs) : 'flat') + '">' + (i ? fmtChg(abs) : '—') + '</td>' +
      '<td class="' + (i ? cls(ch) : 'flat') + '">' + (i ? fmtPct(ch) : '—') + '</td></tr>';
  }).join('');
  const p = rec.perf;
  const box = (k, t) => p[k] ? '<span class="kv">' + t + ' <b class="' + cls(p[k].pct) + '">' + fmtPct(p[k].pct) +
      '</b> <span style="color:var(--ink3)">（' + esc(p[k].base_date) + ' 起 ' + p[k].span + ' 个数据点）</span></span>' : '';
  return '<tr class="detail"><td colspan="' + COLS.length + '"><div class="dbox">' +
    '<div class="dhead">' +
      box('p5', '近5期') + box('p10', '近10期') + box('p20', '近20期') +
      '<span class="kv">数据区间 <b>' + esc(rec.first || '—') + ' ~ ' + esc(rec.last || '—') + '</b></span>' +
      '<span class="kv">样本数 <b>' + rec.n + '</b></span>' +
      '<span class="kv">指标ID <b>' + esc(rec.iid || '—') + '</b></span>' +
      '<span class="kv">近10期最高/最低 <b>' + fmt(rec.hi) + ' / ' + fmt(rec.lo) + '</b></span>' +
    '</div>' +
    '<table class="mini"><thead><tr><th>日期</th><th>价格</th><th>较前一数据点</th><th>涨跌幅</th></tr></thead>' +
    '<tbody>' + rowsHtml + '</tbody></table>' +
  '</div></td></tr>';
}
function render() {
  const it = rows();
  const tb = document.getElementById('tbody');
  tb.innerHTML = it.map(rec => {
    const open = state.open === rec.sector + '|' + rec.iid + '|' + rec.name;
    const tag = rec.sector === '油-芳烃板块'
      ? '<span class="tag oil">油-芳烃</span>' : '<span class="tag gas">气煤-烯烃</span>';
    const rg = (rec.lo !== null && rec.hi !== null) ? fmt(rec.lo) + ' ~ ' + fmt(rec.hi) : '—';
    const p10 = rec.perf.p10;
    const main = '<tr class="row' + (open ? ' open' : '') + '" data-k="' + esc(rec.sector + '|' + rec.iid + '|' + rec.name) + '">' +
      '<td class="l"><span class="nm">' + tag + esc(rec.name) + '</span>' +
        '<div class="sub">' + esc(rec.iid || '') + '</div></td>' +
      '<td class="l hide-s" style="color:var(--ink3)">' + esc(rec.unit || '—') + '</td>' +
      '<td class="l">' + esc(rec.date || '—') + (rec.stale ? '<span class="badge-stale">滞后</span>' : '') + '</td>' +
      '<td>' + fmt(rec.value) + '</td>' +
      '<td class="hide-s ' + cls(rec.chg) + '">' + fmtChg(rec.chg) + '</td>' +
      '<td><span class="pill ' + cls(rec.chg_pct) + '">' + fmtPct(rec.chg_pct) + '</span></td>' +
      '<td class="' + cls(p10 ? p10.pct : null) + '">' + fmtPct(p10 ? p10.pct : null) + '</td>' +
      '<td class="hide-s l">' + spark(rec) + '</td>' +
      '<td class="hide-s l" style="color:var(--ink2)">' + rg + '</td>' +
      '<td class="hide-s" style="color:var(--ink3)">' + rec.n + '</td></tr>';
    return main + (open ? detailRow(rec) : '');
  }).join('');
  document.getElementById('empty').style.display = it.length ? 'none' : '';
  document.querySelectorAll('tr.row').forEach(tr => {
    tr.onclick = () => { const k = tr.dataset.k; state.open = (state.open === k ? null : k); render(); };
  });
  const c = COLS.find(x => x.k === state.sort);
  document.querySelectorAll('#thead th').forEach(th => {
    const on = th.dataset.k === state.sort;
    th.classList.toggle('sorted', on);
    th.querySelector('.ar').textContent = on ? (state.dir > 0 ? '▲' : '▼') : '▲';
  });
}

/* ---------- 事件 ---------- */
function renderTabs() {
  document.getElementById('tabs').innerHTML = SECTORS.map(s =>
    '<button data-k="' + s.k + '" class="' + (state.sector === s.k ? 'on' : '') + '">' + s.label +
    ' <span style="opacity:.55">' + s.n + '</span></button>').join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
    state.sector = b.dataset.k; state.open = null; renderTabs(); render();
  });
}
document.getElementById('q').oninput = e => { state.q = e.target.value; render(); };
document.getElementById('onlyMove').onchange = e => { state.onlyMove = e.target.checked; render(); };
document.getElementById('onlyStale').onchange = e => { state.onlyStale = e.target.checked; render(); };

renderMeta(); renderKpis(); renderTabs(); renderHead(); render();
document.getElementById('foot').innerHTML =
    DATA.meta.note;
</script>
</body>
</html>
